<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pacífico Cauca - Municipios</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f3f7f8; }
    .wrap { max-width: 1200px; margin: 20px auto; padding: 0 16px; }
    select {
      width: 100%; max-width: 320px; padding: 10px 12px; font-size: 16px;
      border-radius: 10px; border: 2px solid #1f6fb2; margin-bottom: 16px;
    }
    #map { height: 620px; border-radius: 14px; border: 1px solid #d8e0e5; box-shadow: 0 8px 26px rgba(0,0,0,.1); }
  </style>
</head>
<body>
  <div class="wrap">
    <label for="municipioSelect"><strong>Municipio del Pacífico caucano</strong></label>
    <select id="municipioSelect">
      <option value="">Seleccione un municipio</option>
      <option value="Guapi">Guapi</option>
      <option value="Timbiquí">Timbiquí</option>
      <option value="López de Micay">López de Micay</option>
    </select>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([2.55, -77.60], 8);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const municipiosLayer = L.geoJSON(null, {
      style: {
        color: '#0F6FAE',
        weight: 2,
        fillColor: '#7cc6ff',
        fillOpacity: 0.35
      },
      onEachFeature: function (feature, layer) {
        const nombre = feature.properties.municipio || feature.properties.name;
        layer.bindPopup('<b>' + nombre + '</b>');
      }
    }).addTo(map);

    fetch('geojson/pacifico_cauca_municipios.geojson')
      .then(res => res.json())
      .then(data => {
        const municipios = data.features.filter(f => {
          const nombre = (f.properties.municipio || '').toLowerCase();
          return ['guapi', 'timbiquí', 'lópez de micay', 'lopez de micay'].includes(nombre);
        });

        municipiosLayer.addData({
          type: 'FeatureCollection',
          features: municipios
        });

        document.getElementById('municipioSelect').addEventListener('change', function () {
          const nombre = this.value;
          if (!nombre) return;

          let target = null;
          municipiosLayer.eachLayer(layer => {
            const n = (layer.feature.properties.municipio || '').toLowerCase();
            if (n === nombre.toLowerCase() || n === nombre.toLowerCase().replace('lópez', 'lopez')) {
              target = layer;
            }
          });

          if (target) {
            map.flyToBounds(target.getBounds(), {
              padding: [35, 35],
              maxZoom: 11,
              duration: 1.5
            });
          }
        });
      })
      .catch(err => {
        console.error('No se pudo cargar GeoJSON:', err);
      });
  </script>
</body>
</html>
